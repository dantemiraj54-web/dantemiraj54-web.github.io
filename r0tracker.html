<style>
  html, body { margin:0; padding:0; }
  body, body * { box-sizing: border-box; }
  body {
    --navy: #14293F;
    --navy-soft: #1E3A56;
    --paper: #F4F6F9;
    --card: #FFFFFF;
    --line: #E3E7EE;
    --ink: #1B2430;
    --ink-soft: #667085;
    --hit: #167A5C;
    --hit-bg: #E7F5EF;
    --miss: #C1440E;
    --miss-bg: #FBECE4;
    --base-bg: #EEF1F5;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    background: var(--paper);
    color: var(--ink);
    min-height: 100vh;
  }
  .shell { max-width: 1040px; margin: 0 auto; padding: 28px 20px 60px; }

  .head {
    background: linear-gradient(135deg, var(--navy) 0%, var(--navy-soft) 100%);
    border-radius: 16px; padding: 26px 28px; color: #fff; margin-bottom: 20px;
    position: relative; overflow: hidden;
  }
  .head::after {
    content: ""; position: absolute; right: -60px; top: -60px;
    width: 200px; height: 200px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,0.08) 0%, transparent 70%);
  }
  .eyebrow { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; opacity: 0.65; font-weight: 600; }
  .headline { font-size: 25px; font-weight: 700; margin-top: 6px; letter-spacing: -0.01em; }
  .conn-pill { display:inline-flex; align-items:center; gap:6px; font-size:11px; font-weight:700; padding:4px 10px; border-radius:999px; margin-top:12px; }
  .conn-pill.ok { background: rgba(127,227,190,0.15); color:#7FE3BE; }
  .conn-pill.bad { background: rgba(255,154,115,0.15); color:#FF9A73; }
  .dot { width:7px; height:7px; border-radius:50%; background:currentColor; display:inline-block; }
  .headstat-row { display: flex; gap: 26px; margin-top: 18px; flex-wrap: wrap; }
  .headstat .num { font-size: 26px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
  .headstat .lbl { font-size: 11.5px; opacity: 0.7; margin-top: 4px; }
  .headstat.hit .num { color: #7FE3BE; }
  .headstat.miss .num { color: #FF9A73; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 20px 22px; margin-bottom: 18px; }
  .card h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-soft); font-weight: 700; margin: 0 0 14px; }
  .card .sub { font-size: 12.5px; color: var(--ink-soft); margin: -8px 0 14px; }

  .controls-row { display: flex; gap: 16px; flex-wrap: wrap; align-items: flex-end; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label { font-size: 12px; color: var(--ink-soft); font-weight: 600; }
  .field input[type="date"], .field input[type="number"] {
    border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; font-size: 14px; color: var(--ink); background: #fff; width: 190px;
  }
  .field input:focus { outline: 2px solid #9FC1D9; outline-offset: 1px; }

  textarea#pasteArea {
    width: 100%; min-height: 110px; border: 1px solid var(--line); border-radius: 10px; padding: 12px 13px;
    font-size: 13px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; resize: vertical; color: var(--ink);
  }
  .row-gap { margin-top: 12px; }
  .btn { border: none; border-radius: 8px; padding: 10px 18px; font-size: 13px; font-weight: 600; cursor: pointer; }
  .btn:active { transform: translateY(1px); }
  .btn-primary { background: var(--navy); color: #fff; }
  .btn-primary:hover { box-shadow: 0 2px 10px rgba(20,41,63,0.25); }
  .btn-ghost { background: transparent; color: var(--navy); border: 1px solid var(--line); }
  .btn-ghost:hover { background: #F0F2F6; }
  .file-btn { position: relative; overflow: hidden; display: inline-block; }
  .file-btn input[type="file"] { position: absolute; inset: 0; opacity: 0; cursor: pointer; font-size: 100px; }

  .status-msg { font-size: 13px; margin-top: 10px; padding: 9px 12px; border-radius: 8px; display: none; }
  .status-msg.show { display: block; }
  .status-ok { background: var(--hit-bg); color: var(--hit); }
  .status-warn { background: #FFF6E5; color: #9A6300; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  thead th { text-align: right; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-soft); font-weight: 700; padding: 8px 9px; border-bottom: 2px solid var(--line); }
  thead th.left { text-align: left; }
  tbody td { padding: 9px 9px; border-bottom: 1px solid var(--line); vertical-align: middle; text-align: right; }
  tbody td.left { text-align: left; }
  tbody tr:hover { background: #FAFBFD; }
  tbody tr.miss-row { background: var(--miss-bg); }
  tbody tr.miss-row:hover { background: #F8E1D4; }
  .agent-name { font-weight: 600; }
  .num-cell { font-variant-numeric: tabular-nums; }
  .badge { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 700; padding: 4px 9px; border-radius: 999px; white-space: nowrap; }
  .badge.hit { background: var(--hit-bg); color: var(--hit); }
  .badge.miss { background: #fff; color: var(--miss); border: 1px solid var(--miss); }
  .badge.base { background: var(--base-bg); color: var(--ink-soft); }
  .short { color: var(--miss); font-weight: 700; }
  .zero { color: var(--ink-soft); }

  .hist-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  select#histSelect { border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; font-size: 13px; min-width: 220px; }
  .empty-note { color: var(--ink-soft); font-size: 13px; padding: 6px 0 2px; }
  .footnote { font-size: 11.5px; color: var(--ink-soft); margin-top: 10px; }
  .setup-banner { background:#FFF6E5; border:1px solid #F0D9A6; color:#7A5300; border-radius:12px; padding:16px 18px; margin-bottom:20px; font-size:13px; line-height:1.5; }
  .setup-banner code { background:#fff; padding:1px 5px; border-radius:4px; }

  .auth-row { display:flex; align-items:center; gap:10px; margin-top:14px; flex-wrap:wrap; }
  .auth-pill { display:inline-flex; align-items:center; gap:8px; font-size:12px; font-weight:600; color:#fff; opacity:0.85; }
  .auth-pill button { background: rgba(255,255,255,0.12); border:1px solid rgba(255,255,255,0.25); color:#fff; border-radius:7px; padding:5px 11px; font-size:12px; font-weight:600; cursor:pointer; }
  .auth-pill button:hover { background: rgba(255,255,255,0.22); }
  .login-toggle { background:none; border:1px solid rgba(255,255,255,0.3); color:#fff; opacity:0.85; border-radius:7px; padding:5px 12px; font-size:12px; font-weight:600; cursor:pointer; }
  .login-toggle:hover { opacity:1; background: rgba(255,255,255,0.1); }
  .login-form { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:10px; }
  .login-form input { border:1px solid rgba(255,255,255,0.3); background: rgba(255,255,255,0.08); color:#fff; border-radius:7px; padding:7px 10px; font-size:12.5px; width:170px; }
  .login-form input::placeholder { color: rgba(255,255,255,0.55); }
  .login-form button { background:#fff; color:var(--navy); border:none; border-radius:7px; padding:7px 14px; font-size:12.5px; font-weight:700; cursor:pointer; }
  .login-error { font-size:12px; color:#FF9A73; margin-top:6px; }
  .view-only-note { color: var(--ink-soft); font-size:13px; background: var(--base-bg); border-radius:10px; padding:12px 14px; }

  .filter-bar { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom: 12px; }
  .filter-toggle { background:transparent; border:1px solid var(--line); color:var(--navy); border-radius:8px; padding:7px 13px; font-size:12.5px; font-weight:600; cursor:pointer; }
  .filter-toggle:hover { background:#F0F2F6; }
  .filter-count { font-size:12px; color:var(--ink-soft); }
  .filter-panel { border:1px solid var(--line); border-radius:10px; padding:14px 16px; margin-bottom:14px; background:#FAFBFD; }
  .filter-actions { display:flex; gap:8px; margin-bottom:12px; }
  .filter-actions button { background:#fff; border:1px solid var(--line); color:var(--navy); border-radius:7px; padding:6px 12px; font-size:12px; font-weight:600; cursor:pointer; }
  .filter-actions button:hover { background:#F0F2F6; }
  .filter-grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap:8px 10px; }
  .filter-item { display:flex; align-items:center; gap:7px; font-size:13px; }
  .filter-item input { width:15px; height:15px; cursor:pointer; }
  .filter-item label { cursor:pointer; }

  .trend-legend { display:flex; gap:18px; align-items:center; font-size:12px; color:var(--ink-soft); margin: -6px 0 16px; }
  .trend-legend .lg { display:flex; align-items:center; gap:6px; }
  .trend-legend .sw { width:12px; height:12px; border-radius:3px; display:inline-block; }
  .trend-legend .ln { width:16px; height:0; border-top:2px dashed var(--ink-soft); display:inline-block; }
  .trend-agent { margin-bottom: 22px; padding-bottom: 18px; border-bottom: 1px solid var(--line); }
  .trend-agent:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
  .trend-agent-head { display:flex; align-items:baseline; justify-content:space-between; margin-bottom: 6px; flex-wrap:wrap; gap:6px; }
  .trend-agent-name { font-weight:700; font-size:13.5px; }
  .trend-agent-stat { font-size:12px; color:var(--ink-soft); }
  .trend-agent-stat strong { color: var(--ink); }
  .trend-up { color: var(--hit); font-weight:700; }
  .trend-down { color: var(--miss); font-weight:700; }
  .trend-flat { color: var(--ink-soft); font-weight:700; }
  .trend-chart { height:auto; display:block; }
  .trend-scroll { overflow-x:auto; overflow-y:hidden; -webkit-overflow-scrolling:touch; scrollbar-width:thin; }
  .scroll-hint { font-size:11px; color:var(--ink-soft); text-align:right; margin-top:2px; }
  .trend-chart .bar-hit { fill: var(--hit); }
  .trend-chart .bar-miss { fill: var(--miss); }
  .trend-chart .req-line { fill:none; stroke: var(--navy); stroke-width:2; stroke-dasharray:4,3; }
  .trend-chart .axis-label { font-size:9px; fill: var(--ink-soft); font-family: -apple-system, sans-serif; }
  .trend-chart .zero-line { stroke: var(--line); stroke-width:1; }
  .trend-chart .grid-line { stroke: var(--line); stroke-width:1; stroke-dasharray:2,3; }
  .trend-chart .bar-label { font-size:10px; font-weight:700; fill: var(--ink); font-family: -apple-system, sans-serif; }
  .trend-chart .req-label { font-size:10px; font-weight:700; fill: var(--navy); font-family: -apple-system, sans-serif; }
</style>

const CONFIG_IS_PLACEHOLDER = firebaseConfig.apiKey === "YOUR_API_KEY";
let db = null;

}

(function(){
  const ROSTER = [
    { alias: "Anitah",          full: "Anitah Nalugwa" },
    { alias: "Elizabeth A",     full: "Elizabeth Akampurira" },
    { alias: "David",           full: "David Wasen" },
    { alias: "Emily",           full: "Emily Namara" },
    { alias: "Flisha",          full: "Sarah Akello Flishia" },
    { alias: "Patience",        full: "Patience Nyamwiza" },
    { alias: "Birungi",         full: "Birungi Nuwagaba" },
    { alias: "Angella",         full: "Angella Athieno" },
    { alias: "Oliver",          full: "Oliver Natoolo" },
    { alias: "Nabyonga",        full: "Racheal  Nabyonga Kisakye" },
    { alias: "Natasha",         full: "Natasha Nakiyaga" },
    { alias: "Violla",          full: "Babirye Violla" },
    { alias: "Kemigisa",        full: "Elizabeth Kemigisa" },
    { alias: "Angel",           full: "Ankwatsiibwe Angel" },
    { alias: "Mercy",           full: "Mercy  Atusasiire" },
    { alias: "Flavia",          full: "Flavia Nangonzi" },
    { alias: "Kenneth",         full: "Kenneth Birungi" },
    { alias: "Gloria",          full: "Gloria Nahirya" },
    { alias: "Manita",          full: "Manita Joan" },
    { alias: "Milly",           full: "Milly Nakkazi" },
    { alias: "Stella",          full: "Akademere Stella Slyvia" },
    { alias: "Florence Mebra",  full: "Florence Kaudha" },
    { alias: "Arthur",          full: "Arthur Ssemwezzi" },
  ];

  const TARGET_DEFAULT = 92100000;
  const CYCLE_END_DEFAULT = "2026-08-10";
  const BASELINE_DATE = "2026-07-15";
  const BASELINE_DATA = {
    "Anitah Nalugwa": 3357000, "Elizabeth Akampurira": 5576500, "David Wasen": 5493200,
    "Emily Namara": 1481200, "Sarah Akello Flishia": 2313600, "Patience Nyamwiza": 4345000,
    "Birungi Nuwagaba": 2979500, "Angella Athieno": 9430000, "Oliver Natoolo": 4505000,
    "Racheal  Nabyonga Kisakye": 3659500, "Natasha Nakiyaga": 2632000,
    "Babirye Violla": 3522000, "Elizabeth Kemigisa": 2693000, "Ankwatsiibwe Angel": 6044400,
    "Mercy  Atusasiire": 3526000, "Flavia Nangonzi": 4031800, "Kenneth Birungi": 1873000,
    "Gloria Nahirya": 1294000, "Manita Joan": 2585000, "Milly Nakkazi": 5036700,
    "Akademere Stella Slyvia": 4927100, "Florence Kaudha": 1418500, "Arthur Ssemwezzi": 200000
  };

  function norm(s){ return (s||"").replace(/\s+/g,' ').trim().toLowerCase(); }
  function fmt(n){ return Math.round(n).toLocaleString('en-US'); }
  function todayStr(){
    const d = new Date();
    return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,'0')+"-"+String(d.getDate()).padStart(2,'0');
  }
  function daysRemaining(fromDateStr, toDateStr){
    const a = new Date(fromDateStr+"T00:00:00");
    const b = new Date(toDateStr+"T00:00:00");
    const diff = Math.round((b - a) / 86400000) + 1;
    return Math.max(diff, 1);
  }
  function addDays(dateStr, n){
    const d = new Date(dateStr+"T00:00:00");
    d.setDate(d.getDate()+n);
    return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,'0')+"-"+String(d.getDate()).padStart(2,'0');
  }
  function keySafe(fullName){
    // Firebase RTDB keys can't contain . # $ [ ] /
    return fullName.replace(/[.#$\[\]\/]/g, '_');
  }

  const state = {
    date: todayStr(),
    target: TARGET_DEFAULT,
    cycleEnd: CYCLE_END_DEFAULT,
    overrides: {},
    logs: {},
    histDates: [],
    connected: false,
    isAdmin: false,
    loginOpen: false,
    loginError: "",
    selectedAgents: [],   // empty = show all
    filterOpen: false,
    cycleMgmtOpen: false,
    archivedCycles: [],
    viewingArchiveId: null,
    viewingArchiveData: null,
    viewingArchiveLoading: false,
    editingArchiveTargetId: null,
  };

  function loadFilterFromStorage(){
    try {
      const raw = localStorage.getItem('tracker-agent-filter');
      if (raw) state.selectedAgents = JSON.parse(raw);
    } catch(e) { /* ignore */ }
  }
  function saveFilterToStorage(){
    try { localStorage.setItem('tracker-agent-filter', JSON.stringify(state.selectedAgents)); }
    catch(e) { /* ignore */ }
  }

  const app = document.getElementById('app');

  function parseCsv(text){
    const lines = text.split(/\r?\n/).map(l=>l.trim()).filter(l=>l.length>0);
    const out = {};
    for (const line of lines) {
      const idx = line.lastIndexOf(',');
      if (idx === -1) continue;
      let name = line.slice(0, idx).trim();
      let val = line.slice(idx+1).trim().replace(/[^0-9.\-]/g,'');
      if (/^(consultant|agent|name)$/i.test(name)) continue;
      if (val === '' || isNaN(Number(val))) continue;
      out[norm(name)] = Number(val);
    }
    return out;
  }

  function matchRoster(parsedMap){
    const collected = {};
    for (const r of ROSTER) {
      const key = norm(r.full);
      if (parsedMap[key] !== undefined) { collected[r.full] = parsedMap[key]; continue; }
      const aliasKey = norm(r.alias);
      let found = undefined;
      for (const pk in parsedMap) {
        if (pk.includes(aliasKey) || aliasKey.includes(pk)) { found = parsedMap[pk]; break; }
      }
      collected[r.full] = found !== undefined ? found : null;
    }
    return collected;
  }

  function decodeLogObj(obj){
    // Firebase stores keys as keySafe(full); map back to full names via ROSTER
    const out = {};
    if (!obj) return out;
    for (const r of ROSTER) {
      const k = keySafe(r.full);
      if (obj[k] !== undefined && obj[k] !== null) out[r.full] = obj[k];
    }
    return out;
  }
  function encodeLogObj(collectedByFull){
    const out = {};
    for (const full in collectedByFull) {
      if (collectedByFull[full] !== null && collectedByFull[full] !== undefined) {
        out[keySafe(full)] = collectedByFull[full];
      }
    }
    return out;
  }

  async function loadSettings(){
    if (!db) return;
    try {
      const snap = await db.ref('settings').once('value');
      if (snap.exists()) {
        const s = snap.val();
        state.target = s.target ?? TARGET_DEFAULT;
        state.cycleEnd = s.cycleEnd ?? CYCLE_END_DEFAULT;
        state.overrides = s.overrides || {};
      }
    } catch (err) {
      console.error('loadSettings failed:', err);
      state.lastDbError = 'Could not load settings from Firebase: ' + (err && err.message ? err.message : err);
    }
  }
  async function saveSettings(){
    if (!db) return;
    try {
      await db.ref('settings').set({ target: state.target, cycleEnd: state.cycleEnd, overrides: state.overrides });
    } catch (err) {
      console.error('saveSettings failed:', err);
      state.lastDbError = 'Could not save settings: ' + (err && err.message ? err.message : err);
    }
  }

  async function seedBaselineIfEmpty(){
    if (!db) return;
    try {
      // Once any cycle has ever been closed, never auto-reseed the original
      // hardcoded baseline again — otherwise clearing 'logs' on a cycle close
      // would make this look "empty" and silently reinject old numbers.
      const archivedSnap = await db.ref('archive_meta').once('value');
      if (archivedSnap.exists()) return;
      const snap = await db.ref('logs/'+BASELINE_DATE).once('value');
      if (snap.exists()) return;
      await db.ref('logs/'+BASELINE_DATE).set(encodeLogObj(BASELINE_DATA));
    } catch (err) {
      console.error('seedBaselineIfEmpty failed:', err);
    }
  }

  async function loadLog(date){
    if (!db) return null;
    try {
      const snap = await db.ref('logs/'+date).once('value');
      const decoded = snap.exists() ? decodeLogObj(snap.val()) : null;
      if (decoded) state.logs[date] = decoded;
      return decoded;
    } catch (err) {
      console.error('loadLog failed:', err);
      state.lastDbError = 'Could not load ' + date + ' from Firebase: ' + (err && err.message ? err.message : err);
      return null;
    }
  }
  async function saveLog(date, collectedByFull){
    if (!db) return;
    try {
      const encoded = encodeLogObj(collectedByFull);
      if (Object.keys(encoded).length > 0) {
        await db.ref('logs/'+date).update(encoded);
      }
      state.logs[date] = { ...(state.logs[date] || {}), ...collectedByFull };
    } catch (err) {
      console.error('saveLog failed:', err);
      state.lastDbError = 'Could not save this CSV to Firebase: ' + (err && err.message ? err.message : err);
      throw err; // let the Apply button's own handler show this in its status line too
    }
  }
  async function clearLog(date){
    if (!db) return;
    try {
      await db.ref('logs/'+date).remove();
      state.logs[date] = {};
    } catch (err) {
      console.error('clearLog failed:', err);
      state.lastDbError = 'Could not clear ' + date + ': ' + (err && err.message ? err.message : err);
    }
  }
  async function refreshHistoryList(){
    if (!db) { state.histDates = []; return; }
    const snap = await db.ref('logs').once('value');
    state.histDates = snap.exists() ? Object.keys(snap.val()).sort() : [];
  }

  function targetFor(full){ return state.overrides[full] !== undefined ? state.overrides[full] : state.target; }

  function prevLoggedDate(date){
    const earlier = state.histDates.filter(d => d < date);
    if (earlier.length === 0) return null;
    return earlier[earlier.length - 1];
  }

  function fmtShort(n){
    const a = Math.abs(n);
    const sign = n < 0 ? '-' : '';
    if (a >= 1e6) return sign + (a/1e6).toFixed(a >= 1e7 ? 0 : 1) + 'M';
    if (a >= 1e3) return sign + (a/1e3).toFixed(0) + 'K';
    return sign + Math.round(a);
  }
  function shortDate(d){
    const parts = d.split('-'); // YYYY-MM-DD
    return parts[1]+'/'+parts[2];
  }

  // Builds the day-over-day (collected vs required-that-day) series for one agent,
  // across every consecutive pair of logged dates. This is derived, not stored —
  // the DB only holds cumulative totals per date.
  function average(arr){ return arr.reduce((a,b)=>a+b,0) / arr.length; }

  // Compares a fixed-size recent window against the window before it, rather
  // than splitting the whole history in half. Otherwise, the longer the cycle
  // runs, the more a genuine recent slide gets buried inside an ever-growing
  // "second half" average — the opposite of what a feedback signal should do.
  function paceStats(series){
    const pcts = series.filter(p => p.required > 0).map(p => (p.collected / p.required) * 100);
    if (pcts.length === 0) return { avgPct: null, trend: 'flat', stillBelowPace: false };
    const avgPct = average(pcts);
    const stillBelowPace = avgPct < 100;
    const WINDOW = 5;
    let trend = 'flat';
    if (pcts.length >= 4) {
      let recent, prior;
      if (pcts.length >= WINDOW * 2) {
        recent = pcts.slice(-WINDOW);
        prior = pcts.slice(-WINDOW * 2, -WINDOW);
      } else {
        const mid = Math.floor(pcts.length / 2);
        recent = pcts.slice(mid);
        prior = pcts.slice(0, mid);
      }
      const a1 = average(prior), a2 = average(recent);
      if (a2 > a1 + 5) trend = 'improving';
      else if (a2 < a1 - 5) trend = 'declining';
    }
    return { avgPct, trend, stillBelowPace };
  }

  function seriesFor(fullName, tgt){
    const series = [];
    for (const d of state.histDates) {
      const prevD = prevLoggedDate(d);
      if (!prevD) continue; // no prior day logged yet, nothing to diff against
      const cumNow = state.logs[d] ? state.logs[d][fullName] : null;
      const cumPrev = state.logs[prevD] ? state.logs[prevD][fullName] : null;
      if (cumNow === null || cumNow === undefined || cumPrev === null || cumPrev === undefined) continue;
      const collected = cumNow - cumPrev;
      const daysAtPrev = daysRemaining(d, state.cycleEnd);
      const required = (tgt - cumPrev) / daysAtPrev;
      series.push({ date: d, collected, required, hit: collected >= required });
    }
    return series;
  }

  function renderAgentSpark(alias, series){
    const H = 160, padL = 38, padR = 10, padTop = 22, padBottom = 20;
    const chartH = H - padTop - padBottom;
    const n = series.length;
    const MIN_SPACING = 46; // fixed px per logged day, so bars stay readable as days pile up
    const BASE_W = 640;     // default width when there aren't enough days to need scrolling yet
    const contentW = padL + padR + Math.max(n-1,0) * MIN_SPACING;
    const W = Math.max(BASE_W, contentW);
    const needsScroll = W > BASE_W;

    const spacing = n > 1 ? (W - padL - padR) / (n - 1) : (W - padL - padR);
    const barW = Math.max(6, Math.min(34, spacing * 0.5));

    const maxVal = Math.max(1, ...series.map(p => Math.max(p.collected, p.required, 0)));

    const yFor = v => padTop + chartH - (Math.max(v,0) / maxVal) * chartH;
    const xFor = i => n > 1 ? padL + i * spacing : padL + (W - padL - padR)/2;
    // keep edge labels/anchors from spilling outside the viewBox
    const anchorFor = i => i === 0 ? 'start' : (i === n-1 ? 'end' : 'middle');

    const bars = series.map((p,i) => {
      const x = xFor(i) - barW/2;
      const y = yFor(p.collected);
      const h = Math.max(0, (padTop + chartH) - y);
      const cls = p.hit ? 'bar-hit' : 'bar-miss';
      const labelY = Math.max(padTop - 2, y - 5);
      return `<rect class="${cls}" x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${h.toFixed(1)}" rx="2">
        <title>${p.date}: collected ${fmt(p.collected)}, required ${fmt(p.required)} (${p.hit ? 'hit' : 'missed'})</title>
      </rect>
      <text class="bar-label" x="${xFor(i).toFixed(1)}" y="${labelY.toFixed(1)}" text-anchor="middle">${fmtShort(p.collected)}</text>`;
    }).join('');

    const linePts = series.map((p,i) => `${xFor(i).toFixed(1)},${yFor(p.required).toFixed(1)}`).join(' ');

    // y-axis gridlines with readable scale values, so bars can be read without hovering
    const gridFracs = [0.25, 0.5, 0.75];
    const gridlines = gridFracs.map(f => {
      const y = padTop + chartH - f*chartH;
      return `<line class="grid-line" x1="${padL}" y1="${y.toFixed(1)}" x2="${W-padR}" y2="${y.toFixed(1)}"></line>
        <text class="axis-label" x="${(padL-6).toFixed(1)}" y="${(y+3).toFixed(1)}" text-anchor="end">${fmtShort(f*maxVal)}</text>`;
    }).join('');

    // label the required line's value at its first and last point only, to avoid clutter
    const reqLabels = [0, n-1].filter((v,i,arr) => arr.indexOf(v) === i).map(i => {
      const y = yFor(series[i].required);
      const labelY = Math.max(padTop - 2, y - 6);
      return `<text class="req-label" x="${xFor(i).toFixed(1)}" y="${labelY.toFixed(1)}" text-anchor="${anchorFor(i)}">${fmtShort(series[i].required)}</text>`;
    }).join('');

    const labelEvery = n <= 8 ? 1 : Math.ceil(n / 8);
    const labels = series.map((p,i) => {
      if (i % labelEvery !== 0 && i !== n-1) return '';
      return `<text class="axis-label" x="${xFor(i).toFixed(1)}" y="${H-4}" text-anchor="${anchorFor(i)}">${shortDate(p.date)}</text>`;
    }).join('');

    return `<div class="trend-scroll">
      <svg class="trend-chart" style="width:${W}px" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">
        ${gridlines}
        <line class="zero-line" x1="${padL}" y1="${(padTop+chartH).toFixed(1)}" x2="${W-padR}" y2="${(padTop+chartH).toFixed(1)}"></line>
        ${bars}
        <polyline class="req-line" points="${linePts}"></polyline>
        ${reqLabels}
        ${labels}
      </svg>
    </div>
    ${needsScroll ? `<div class="scroll-hint">&#8596; scroll to see earlier days</div>` : ''}`;
  }

  function renderTrendCard(rows, hasFilter){
    if (state.histDates.length < 2) {
      return `<div class="card"><h2>Daily Trend vs Target</h2><div class="empty-note">Log at least two dates before a daily trend is possible &mdash; right now there's nothing to diff against.</div></div>`;
    }
    const agents = rows.map(r => ({ alias: r.alias, full: r.full, series: seriesFor(r.full, r.tgt) }))
                        .filter(a => a.series.length > 0);
    if (agents.length === 0) {
      return `<div class="card"><h2>Daily Trend vs Target</h2><div class="empty-note">No day-over-day data yet for the agent(s) currently in view.</div></div>`;
    }
    return `<div class="card">
      <h2>Daily Trend vs Target</h2>
      <div class="sub">${hasFilter ? `Filtered to the ${agents.length} agent(s) selected above.` : `Showing all ${agents.length} agents &mdash; use the filter above to narrow this down.`} Bars are what each agent actually collected that day; the dashed line is the pace that was required that day, recalculated from the prior balance and days left in the cycle.</div>
      <div class="trend-legend">
        <span class="lg"><span class="sw" style="background:var(--hit)"></span>Collected &middot; hit</span>
        <span class="lg"><span class="sw" style="background:var(--miss)"></span>Collected &middot; missed</span>
        <span class="lg"><span class="ln"></span>Required that day</span>
      </div>
      ${agents.map(a => {
        const stats = paceStats(a.series);
        const trendLabel = stats.trend === 'improving'
          ? (stats.stillBelowPace ? '&#8599; improving, still below pace' : '&#8599; improving')
          : stats.trend === 'declining' ? '&#8600; declining'
          : '&#8594; flat';
        const trendCls = stats.trend === 'improving' ? 'trend-up'
          : stats.trend === 'declining' ? 'trend-down' : 'trend-flat';
        return `
        <div class="trend-agent">
          <div class="trend-agent-head">
            <span class="trend-agent-name">${a.alias}</span>
            <span class="trend-agent-stat">
              ${stats.avgPct !== null ? `Avg <strong>${Math.round(stats.avgPct)}%</strong> of pace &middot; ` : ''}
              <span class="${trendCls}">${trendLabel}</span>
              &middot; ${a.series.filter(p=>p.hit).length} hit / ${a.series.filter(p=>!p.hit).length} missed of ${a.series.length} days
            </span>
          </div>
          ${renderAgentSpark(a.alias, a.series)}
        </div>
      `;
      }).join('')}
    </div>`;
  }

  function suggestNextCycleEnd(currentEndStr){
    // Your billing cycle runs the 11th to the 10th, so default the next
    // cycle's end to the 10th of the following month — admin can still edit it.
    const d = new Date(currentEndStr+"T00:00:00");
    d.setMonth(d.getMonth()+1);
    d.setDate(10);
    return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,'0')+"-"+String(d.getDate()).padStart(2,'0');
  }

  // Archives every logged date of the current cycle under a permanent record,
  // then clears the live 'logs' node so the board is empty for the next cycle.
  // Nothing is deleted — archived data stays in Firebase indefinitely.
  async function closeCycleAndStartNew(newEnd, label){
    if (!db) return { ok:false, msg:"Firebase isn't configured." };
    if (!newEnd) return { ok:false, msg:"Pick a new cycle end date first." };
    const rawSnap = await db.ref('logs').once('value');
    const rawLogs = rawSnap.exists() ? rawSnap.val() : {};
    const histDates = Object.keys(rawLogs).sort();
    if (histDates.length === 0) return { ok:false, msg:"Nothing logged yet in this cycle — there's nothing to close." };

    const latestDate = histDates[histDates.length-1];
    const latestDecoded = decodeLogObj(rawLogs[latestDate]);
    let teamTotal = 0, teamTarget = 0;
    for (const r of ROSTER) {
      const v = latestDecoded[r.full];
      if (v !== undefined && v !== null) teamTotal += v;
      teamTarget += targetFor(r.full);
    }

    const cycleId = state.cycleEnd + '_' + Date.now();
    const meta = {
      label: label || ('Cycle ending ' + state.cycleEnd),
      startDate: histDates[0],
      endDate: state.cycleEnd,
      closedAt: Date.now(),
      target: state.target,
      overrides: state.overrides,
      teamTotal, teamTarget,
      daysLogged: histDates.length,
    };

    await db.ref('archive_meta/'+cycleId).set(meta);
    await db.ref('archive_logs/'+cycleId).set(rawLogs);
    await db.ref('logs').remove();
    await db.ref('settings').update({ cycleEnd: newEnd });

    state.logs = {};
    state.histDates = [];
    state.cycleEnd = newEnd;
    state.date = todayStr();

    return { ok:true, msg:`Archived as "${meta.label}". The live board is now clear for the cycle ending ${newEnd}.` };
  }

  async function loadArchivedCyclesMeta(){
    if (!db) { state.archivedCycles = []; return; }
    const snap = await db.ref('archive_meta').once('value');
    if (!snap.exists()) { state.archivedCycles = []; return; }
    const raw = snap.val();
    state.archivedCycles = Object.keys(raw).map(id => ({ id, ...raw[id] })).sort((a,b) => b.closedAt - a.closedAt);
  }

  async function viewArchivedCycle(cycleId){
    state.viewingArchiveId = cycleId;
    state.viewingArchiveLoading = true;
    state.viewingArchiveData = null;
    render();
    const snap = await db.ref('archive_logs/'+cycleId).once('value');
    const raw = snap.exists() ? snap.val() : {};
    const dates = Object.keys(raw).sort();
    const lastDate = dates[dates.length-1];
    const decoded = lastDate ? decodeLogObj(raw[lastDate]) : {};
    const meta = state.archivedCycles.find(c => c.id === cycleId);
    const overrides = (meta && meta.overrides) || {};
    state.viewingArchiveData = ROSTER.map(r => {
      const total = decoded[r.full] !== undefined ? decoded[r.full] : null;
      const target = overrides[r.full] !== undefined ? overrides[r.full] : (meta ? meta.target : TARGET_DEFAULT);
      const hit = total !== null ? total >= target : null;
      return { alias: r.alias, full: r.full, total, target, hit };
    });
    state.viewingArchiveLoading = false;
    render();
  }

  // Edits the target stored on an already-closed cycle. Nothing about closing
  // a cycle is truly final — the archive record is just data, so a wrong
  // target at close time is fixable after the fact.
  async function updateArchivedCycleTarget(cycleId, newTarget){
    if (!db) return;
    const meta = state.archivedCycles.find(c => c.id === cycleId);
    if (!meta) return;
    const overrides = meta.overrides || {};
    let teamTarget = 0;
    for (const r of ROSTER) teamTarget += (overrides[r.full] !== undefined ? overrides[r.full] : newTarget);
    await db.ref('archive_meta/'+cycleId).update({ target: newTarget, teamTarget });
    await loadArchivedCyclesMeta();
    if (state.viewingArchiveId === cycleId) {
      await viewArchivedCycle(cycleId);
    }
  }

    if (!state.isAdmin) return '';
    const suggested = suggestNextCycleEnd(state.cycleEnd);
    return `<div class="card">

      ${!state.cycleMgmtOpen ? `
        <button class="btn btn-ghost" id="openCloseCycleBtn" ${state.histDates.length===0?'disabled':''}>Close Cycle &amp; Start New</button>

            <div class="footnote">This only fixes the target and % achieved recorded on this closed cycle &mdash; it does not touch the live board or any current cycle.</div>

  }

  function renderSetupBanner(){
    return `<div class="setup-banner">
      <strong>Firebase isn't configured yet.</strong> Open this file, find <code>firebaseConfig</code> near the top of the &lt;script&gt;, and paste in your project's config values from the Firebase console (Project settings → General → Your apps → SDK setup). Until then, data won't save or sync.
    </div>`;
  }

  function render(){
    const cur = state.logs[state.date] || null;
    const prevDate = prevLoggedDate(state.date);
    const prev = prevDate ? state.logs[prevDate] : null;

    const rowsAll = ROSTER.map(r => {
      const tgt = targetFor(r.full);
      const cumNow = cur ? cur[r.full] : null;
      const cumPrev = prev ? prev[r.full] : null;
      const hasNow = cumNow !== null && cumNow !== undefined;
      const hasPrev = cumPrev !== null && cumPrev !== undefined;

      let todayCollected = null, requiredToday = null, hit = null, shortfall = null;
      if (hasNow && hasPrev) {
        todayCollected = cumNow - cumPrev;
        const daysAtPrev = daysRemaining(state.date, state.cycleEnd);
        requiredToday = (tgt - cumPrev) / daysAtPrev;
        hit = todayCollected >= requiredToday;
        shortfall = hit ? 0 : (requiredToday - todayCollected);
      }
      const remaining = hasNow ? Math.max(tgt - cumNow, 0) : null;
      const daysFwd = daysRemaining(addDays(state.date,1), state.cycleEnd);
      const nextPace = hasNow ? remaining / daysFwd : null;

      return { ...r, tgt, cumNow, hasNow, hasPrev, todayCollected, requiredToday, hit, shortfall, remaining, nextPace };
    });
    const hasFilter = state.selectedAgents.length > 0;
    const rows = hasFilter ? rowsAll.filter(r => state.selectedAgents.includes(r.full)) : rowsAll;

    const measured = rows.filter(r => r.hasNow && r.hasPrev);
    const hitCount = measured.filter(r => r.hit).length;
    const missCount = measured.filter(r => !r.hit).length;
    const totalShortfall = measured.filter(r => !r.hit).reduce((s,r)=>s+r.shortfall,0);
    const isBaselineOnly = !prev;

    app.innerHTML = `

        ${CONFIG_IS_PLACEHOLDER ? renderSetupBanner() : ''}

            <div class="headstat hit"><div class="num">${hitCount}</div><div class="lbl">hit daily pace</div></div>
            <div class="headstat miss"><div class="num">${missCount}</div><div class="lbl">missed daily pace</div></div>
            <div class="headstat"><div class="num">${fmt(totalShortfall)}</div><div class="lbl">total shortfall (UGX)</div></div>
          </div>
        </div>

        ${state.isAdmin ? `
        <div class="card">
          <h2>Log today's standings</h2>
          <div class="sub">Paste or upload the day's CSV of <strong>cumulative</strong> totals (Consultant, Total) &mdash; the same format your daily export already comes in.</div>
          <div class="controls-row">
            <div class="field">
              <label for="dateInput">Date of this CSV</label>
              <input type="date" id="dateInput" value="${state.date}">
            </div>
            <div class="field">
              <label for="targetInput">Target per agent (UGX)</label>
              <input type="number" id="targetInput" value="${state.target}" step="100000">
            </div>
            <div class="field">
              <label for="cycleEndInput">Cycle ends</label>
              <input type="date" id="cycleEndInput" value="${state.cycleEnd}">
            </div>

              Upload CSV

          ${!cur ? `<div class="empty-note">No CSV logged for this date yet. Paste or upload above.</div>` : (rows.length === 0 ? `<div class="empty-note">No agents match the current filter.</div>` : `
          ${isBaselineOnly ? `<div class="sub">This is the first day logged, so there's no prior total to measure today's collection against yet &mdash; showing cumulative standing and the pace needed going forward. Once you log the next day's CSV, hit/miss will show.</div>` : ''}
          <table>
            <thead>
              <tr>
                <th class="left">Agent</th>
                <th>Cumulative</th>
                ${!isBaselineOnly ? `<th>Collected today</th><th>Required today</th><th>Status</th><th>Shortfall</th>` : ''}
                <th>Remaining to target</th>
                <th>Pace needed / day (fwd)</th>
              </tr>
            </thead>
            <tbody>
              ${rows.map(r => `
                <tr class="${r.hasNow && r.hasPrev && !r.hit ? 'miss-row' : ''}">
                  <td class="left agent-name">${r.alias}<div style="font-weight:400;font-size:11.5px;color:var(--ink-soft);">${r.full}</div></td>
                  <td class="num-cell">${r.hasNow ? fmt(r.cumNow) : '&mdash;'}</td>
                  ${!isBaselineOnly ? `
                    <td class="num-cell">${r.hasPrev && r.hasNow ? fmt(r.todayCollected) : '<span class="zero">&mdash;</span>'}</td>
                    <td class="num-cell">${r.hasPrev && r.hasNow ? fmt(r.requiredToday) : '&mdash;'}</td>
                    <td>${r.hasPrev && r.hasNow ? (r.hit ? `<span class="badge hit">&#10003; Hit</span>` : `<span class="badge miss">&#10007; Missed</span>`) : `<span class="badge base">No prior day</span>`}</td>
                    <td class="num-cell">${r.hasPrev && r.hasNow && !r.hit ? `<span class="short">${fmt(r.shortfall)}</span>` : '<span class="zero">&mdash;</span>'}</td>
                  ` : ''}
                  <td class="num-cell">${r.hasNow ? fmt(r.remaining) : '&mdash;'}</td>
                  <td class="num-cell">${r.hasNow ? fmt(r.nextPace) : '&mdash;'}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
          `)}
        </div>

        ${renderTrendCard(rows, hasFilter)}

        <div class="card">
          <h2>History</h2>
          <div class="hist-row">
            <select id="histSelect">
              <option value="">Jump to a logged date&hellip;</option>
              ${state.histDates.slice().reverse().map(d => `<option value="${d}" ${d===state.date?'selected':''}>${d}${d===BASELINE_DATE?' (baseline)':''}</option>`).join('')}
            </select>
          </div>
          <div class="footnote">Every date logged here is saved to Firebase and shared live &mdash; anyone with this page's URL sees the same data, updated in real time. "Required today" is recalculated each day from the prior day's balance and the days left to the cycle end date above.</div>
        </div>

        ${renderCycleManagementCard()}
        ${renderPastCyclesCard()}
      </div>
    `;

    const loginToggleBtn = document.getElementById('loginToggleBtn');
    if (loginToggleBtn) {
      loginToggleBtn.addEventListener('click', () => {
        state.loginOpen = !state.loginOpen;
        state.loginError = "";
        render();
      });
    }
    const loginSubmitBtn = document.getElementById('loginSubmitBtn');
    if (loginSubmitBtn) {
      loginSubmitBtn.addEventListener('click', async () => {
        const email = document.getElementById('loginEmail').value.trim();
        const pw = document.getElementById('loginPassword').value;
        if (!auth) { state.loginError = "Firebase isn't configured yet."; render(); return; }
        try {
          await auth.signInWithEmailAndPassword(email, pw);
          state.loginOpen = false;
          state.loginError = "";
        } catch (err) {
          state.loginError = "Sign-in failed — check the email and password.";
          render();
        }
      });
    }
    const logoutBtn = document.getElementById('logoutBtn');
    if (logoutBtn) {
      logoutBtn.addEventListener('click', async () => {
        if (auth) await auth.signOut();
      });
    }

    const dateInputEl = document.getElementById('dateInput');
    if (dateInputEl) dateInputEl.addEventListener('change', async (e) => {
      state.date = e.target.value;
      render(); // reflect the picked date (Apply button label etc.) immediately, don't wait on the network
      if (!state.logs[state.date]) { await loadLog(state.date); render(); }
    });
    const targetInputEl = document.getElementById('targetInput');
    if (targetInputEl) targetInputEl.addEventListener('change', async (e) => {
      state.target = Number(e.target.value) || TARGET_DEFAULT;
      await saveSettings(); render();
    });
    const cycleEndInputEl = document.getElementById('cycleEndInput');
    if (cycleEndInputEl) cycleEndInputEl.addEventListener('change', async (e) => {
      state.cycleEnd = e.target.value || CYCLE_END_DEFAULT;
      await saveSettings(); render();
    });
    const fileInputEl = document.getElementById('fileInput');
    if (fileInputEl) fileInputEl.addEventListener('change', (e) => {
      const file = e.target.files[0]; if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => { document.getElementById('pasteArea').value = ev.target.result; };
      reader.readAsText(file);
    });
    const applyBtnEl = document.getElementById('applyBtn');
    if (applyBtnEl) applyBtnEl.addEventListener('click', async () => {
      const text = document.getElementById('pasteArea').value;
      const statusEl = document.getElementById('statusMsg');
      if (!db) {
        statusEl.textContent = "Firebase isn't configured yet — see the yellow banner above.";
        statusEl.className = "status-msg show status-warn"; return;
      }
      if (!text.trim()) {
        statusEl.textContent = "Paste or upload a CSV first.";
        statusEl.className = "status-msg show status-warn"; return;
      }
      const parsed = parseCsv(text);
      const collected = matchRoster(parsed);
      const matchedCount = Object.values(collected).filter(v => v !== null).length;
      try {
        await saveLog(state.date, collected);
        await refreshHistoryList();
        statusEl.textContent = `Matched ${matchedCount} of ${ROSTER.length} agents for ${state.date}.` +
          (matchedCount < ROSTER.length ? " Unmatched agents show as no data." : "");
        statusEl.className = "status-msg show " + (matchedCount === ROSTER.length ? "status-ok" : "status-warn");
      } catch (err) {
        statusEl.textContent = "Firebase rejected this save: " + (err && err.message ? err.message : err) + " — check your database rules or connection, nothing was saved.";
        statusEl.className = "status-msg show status-warn";
      }
      render();
    });
    const clearBtnEl = document.getElementById('clearBtn');
    if (clearBtnEl) clearBtnEl.addEventListener('click', async () => {
      await clearLog(state.date);
      document.getElementById('pasteArea').value = '';
      render();
    });
    const histSelect = document.getElementById('histSelect');
    if (histSelect) {
      histSelect.addEventListener('change', async (e) => {
        if (!e.target.value) return;
        state.date = e.target.value;
        render();
        if (!state.logs[state.date]) { await loadLog(state.date); render(); }
      });
    }

    const filterToggleBtn = document.getElementById('filterToggleBtn');
    if (filterToggleBtn) {
      filterToggleBtn.addEventListener('click', () => {
        state.filterOpen = !state.filterOpen;
        render();
      });
    }
    const filterAllBtn = document.getElementById('filterAllBtn');
    if (filterAllBtn) {
      filterAllBtn.addEventListener('click', () => {
        state.selectedAgents = [];
        saveFilterToStorage();
        render();
      });
    }
    const filterNoneBtn = document.getElementById('filterNoneBtn');
    if (filterNoneBtn) {
      filterNoneBtn.addEventListener('click', () => {
        state.selectedAgents = ROSTER.map(r => r.full).length ? [ROSTER[0].full] : [];
        // "Clear filter" here means narrow to nothing selected visibly checked off;
        // simplest reliable behavior: uncheck everything by selecting an empty, existing agent set
        state.selectedAgents = ['__none__'];
        saveFilterToStorage();
        render();
      });
    }
    document.querySelectorAll('.filter-item input[type="checkbox"]').forEach(chk => {
      chk.addEventListener('change', () => {
        const currentlyAll = state.selectedAgents.length === 0;
        let selected = currentlyAll ? ROSTER.map(r => r.full) : state.selectedAgents.slice();
        selected = selected.filter(f => f !== '__none__');
        document.querySelectorAll('.filter-item input[type="checkbox"]').forEach(c => {
          const full = decodeURIComponent(c.dataset.full);
          if (c.checked && !selected.includes(full)) selected.push(full);
          if (!c.checked && selected.includes(full)) selected = selected.filter(f => f !== full);
        });
        state.selectedAgents = selected;
        saveFilterToStorage();
        render();
      });
    });

    const openCloseCycleBtn = document.getElementById('openCloseCycleBtn');
    if (openCloseCycleBtn) openCloseCycleBtn.addEventListener('click', () => {
      state.cycleMgmtOpen = true;
      render();
    });
    const cancelCloseCycleBtn = document.getElementById('cancelCloseCycleBtn');
    if (cancelCloseCycleBtn) cancelCloseCycleBtn.addEventListener('click', () => {
      state.cycleMgmtOpen = false;
      render();
    });
    const confirmCloseCycleBtn = document.getElementById('confirmCloseCycleBtn');
    if (confirmCloseCycleBtn) confirmCloseCycleBtn.addEventListener('click', async () => {
      const statusEl = document.getElementById('cycleStatusMsg');
      const confirmText = document.getElementById('closeConfirmInput').value.trim();
      if (confirmText !== 'CLOSE') {
        statusEl.textContent = "Type CLOSE exactly (all caps) to confirm — this step exists so a misclick can't wipe the live board.";
        statusEl.className = "status-msg show status-warn";
        return;
      }
      const newEnd = document.getElementById('newCycleEndInput').value;
      const label = document.getElementById('newCycleLabelInput').value.trim();
      confirmCloseCycleBtn.disabled = true;
      confirmCloseCycleBtn.textContent = 'Archiving…';
      const result = await closeCycleAndStartNew(newEnd, label);
      if (result.ok) {
        state.cycleMgmtOpen = false;
        await loadArchivedCyclesMeta();
        render();
      } else {
        statusEl.textContent = result.msg;
        statusEl.className = "status-msg show status-warn";
        confirmCloseCycleBtn.disabled = false;
        confirmCloseCycleBtn.textContent = 'Confirm: Archive & Start New Cycle';
      }
    });
    document.querySelectorAll('[data-view-archive]').forEach(btn => {
      btn.addEventListener('click', async () => {
        const id = btn.dataset.viewArchive;
        if (state.viewingArchiveId === id) {
          state.viewingArchiveId = null;
          state.viewingArchiveData = null;
          render();
        } else {
          await viewArchivedCycle(id);
        }
      });
    });
    document.querySelectorAll('[data-edit-archive-target]').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.dataset.editArchiveTarget;
        state.editingArchiveTargetId = state.editingArchiveTargetId === id ? null : id;
        render();
      });
    });
    document.querySelectorAll('[data-save-archive-target]').forEach(btn => {
      btn.addEventListener('click', async () => {
        const id = btn.dataset.saveArchiveTarget;
        const input = document.getElementById('archiveTargetInput_'+id);
        const newTarget = Number(input.value);
        if (!newTarget || newTarget <= 0) return;
        btn.disabled = true;
        btn.textContent = 'Saving…';
        await updateArchivedCycleTarget(id, newTarget);
        state.editingArchiveTargetId = null;
        render();
      });
    });
  }

  async function init(){
    loadFilterFromStorage();
    if (auth) {
      auth.onAuthStateChanged((user) => {
        state.isAdmin = !!user;
        render();
      });
    }
    if (db) {
      await loadSettings();
      await seedBaselineIfEmpty();
      await refreshHistoryList();
      await loadLog(state.date);
      if (!state.logs[BASELINE_DATE]) await loadLog(BASELINE_DATE);
      await loadArchivedCyclesMeta();

      // live sync: re-render whenever any log changes, so everyone sees updates instantly
      db.ref('logs').on('value', async (snap) => {
        if (!snap.exists()) return;
        const raw = snap.val();
        state.histDates = Object.keys(raw).sort();
        for (const d of state.histDates) state.logs[d] = decodeLogObj(raw[d]);
        render();
      });
      db.ref('settings').on('value', (snap) => {
        if (!snap.exists()) return;
        const s = snap.val();
        state.target = s.target ?? TARGET_DEFAULT;
        state.cycleEnd = s.cycleEnd ?? CYCLE_END_DEFAULT;
        state.overrides = s.overrides || {};
        render();
      });
    }
    render();
  }
  init();
})();
</script>
</body>
</html>
